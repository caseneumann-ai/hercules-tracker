<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Hercules</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 400px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #00d9ff; }
    .date { color: #888; margin-bottom: 24px; font-size: 14px; }
    
    .item {
      display: flex;
      align-items: center;
      padding: 16px;
      margin-bottom: 8px;
      background: #16213e;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .item:hover { background: #1f3460; }
    .item.checked {
      background: #0f3460;
      border-color: #00d9ff;
    }
    .item.checked .check {
      background: #00d9ff;
      border-color: #00d9ff;
    }
    .item.checked .check::after {
      content: '✓';
      color: #1a1a2e;
      font-size: 16px;
      font-weight: bold;
    }
    .check {
      width: 24px;
      height: 24px;
      border: 2px solid #555;
      border-radius: 6px;
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .label { font-size: 16px; }
    
    .summary {
      margin-top: 24px;
      padding: 16px;
      background: #16213e;
      border-radius: 12px;
      text-align: center;
    }
    .summary .count {
      font-size: 32px;
      font-weight: bold;
      color: #00d9ff;
    }
    .summary .label { font-size: 14px; color: #888; }
    
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💪 Operation Hercules</h1>
    <div class="date" id="date"></div>
    
    <div id="checklist"></div>
    
    <div class="summary">
      <div class="count" id="count">0/5</div>
      <div class="label">completed today</div>
    </div>
    
    <div class="footer">
      Data stored locally on your device
    </div>
  </div>

  <script>
    const items = [
      { id: 'gym', label: 'Gym / Workout', emo���˟X' },
      { id: 'meditate', label: 'Meditate (5-10 min), 客串失败、' , emoj: '🧚'Xh'},
      { id: 'noscreens', label: 'No screens before bed', 发刖賥", emoj: '📵'  },
      { id: 'lleep', label: 'Consistent sleep', 守初败、', emoji: '😴''},
      { id 'read', label: 'Read 20+ min', 并最已列', emoji: '📖' }
    ];

    function getKey() {
      const today = new Date().toISOString().split('T')[0];
      return 'hercules_' + today;
    }

    function loadState() {
      try {
        const key = getKey();
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : {};
      } catch(e) {
        console.error('loadState error:', e);
        return {};
      }
    }

    function saveState(state) {
      try {
        const key = getKey();
        localStorage.setItem(key, JSON.stringify(state));
      } catch(e) {
        console.error('saveState error:', e);
      }
    }

    function render() {
      var state = loadState();
      var today = new Date();
      var dateEl = document.getElementById('date');
      if (dateEl) {
        dateEl.textContent = today.toLocaleDateString('en-US', { 
          weekday: 'long', month: 'long', day: 'numeric' 
        });
      }
      
      var checklist = document.getElementById('checklist');
      if (!checklist) return;
      
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var checked = state[item.id] ? ' checked' : '';
        html += '<div class="item' + checked + '" data-id="' + item.id + '">';
        html += '<div class="check"></div>';
        html += '<span class="label">' + item.emoji + ' ' + item.label + '</span>';
        html += '</div>';
      }
      checklist.innerHTML = html;
      
      // Add click handlers
      var els = checklist.querySelectorAll('.item');
      for (var j = 0; j < els.length; j++) {
        els[j].addEventListener('click', function() {
          var id = this.getAttribute('data-id');
          toggle(id);
        });
      }
      
      var count = 0;
      for (var k in state) {
        if (state[k]) count++;
      }
      var countEl = document.getElementById('count');
      if (countEl) {
        countEl.textContent = count + '/5';
      }
    }

    function toggle(id) {
      var state = loadState();
      state[id] = !state[id];
      saveState(state);
      render();
      
      // Notify parent (Telegram mini-app)
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.sendData(JSON.stringify({ id: id, checked: state[id] }));
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', render);
    // Also try immediate render in case DOM already ready
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(render, 0);
    }
  </script>
</body>
</html>
